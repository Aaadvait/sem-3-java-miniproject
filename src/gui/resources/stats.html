<!DOCTYPE html>
<html>
<head>
<style>
  body {
    background-color: #06182b;
    color: white;
    font-family: 'Arial', sans-serif;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 {
    font-size: 40px;
    color: #fff;
    margin-bottom: 40px;
  }
  .card-container {
    display: flex;
    gap: 60px;
  }
  .card {
    background-color: rgba(6, 24, 43, 0.86);
    border: 2px solid #cceeee;
    border-radius: 12px;
    padding: 30px;
    min-width: 320px;
    box-shadow: 0 0 15px rgba(204, 238, 238, 0.3);
  }
  .card h2 {
    text-align: center;
    color: white;
    margin-top: 0;
  }
  .stat-line {
    font-size: 18px;
    margin: 10px 0;
    color: white;
  }
  .stat-line-d {
    font-size: 18px;
    margin: 10px 0;
    color: #9fc6e0;
  }
</style>
<script>
  // Simple JS to parse URL parameters and display them
  window.onload = function() {
    const urlParams = new URLSearchParams(window.location.search);
    
    document.getElementById('w-games').textContent = urlParams.get('wg') || '0';
    document.getElementById('w-wins').textContent = urlParams.get('ww') || '0';
    document.getElementById('w-losses').textContent = urlParams.get('wl') || '0';
    document.getElementById('w-draws').textContent = urlParams.get('wd') || '0';
    document.getElementById('w-winrate').textContent = (urlParams.get('wwr') || '0.0') + '%';
    document.getElementById('w-acc').textContent = (urlParams.get('wacc') || '0.0') + '%';

    document.getElementById('b-games').textContent = urlParams.get('bg') || '0';
    document.getElementById('b-wins').textContent = urlParams.get('bw') || '0';
    document.getElementById('b-losses').textContent = urlParams.get('bl') || '0';
    document.getElementById('b-draws').textContent = urlParams.get('bd') || '0';
    document.getElementById('b-winrate').textContent = (urlParams.get('bwr') || '0.0') + '%';
    document.getElementById('b-acc').textContent = (urlParams.get('bacc') || '0.0') + '%';
  };
</script>
</head>
<body>
  <h1>STATISTICS</h1>
  <div class="card-container">
    <div class="card" id="white-card">
      <h2>WHITE</h2>
      <div class="stat-line">Games Played: <span id="w-games"></span></div>
      <div class="stat-line">Wins: <span id="w-wins"></span></div>
      <div class="stat-line">Losses: <span id="w-losses"></span></div>
      <div class="stat-line">Draws: <span id="w-draws"></span></div>
      <div class="stat-line-d">Win Rate: <span id="w-winrate"></span></div>
      <div class="stat-line-d">Avg Accuracy: <span id="w-acc"></span></div>
    </div>
    <div class="card" id="black-card">
      <h2>BLACK</h2>
      <div class="stat-line">Games Played: <span id="b-games"></span></div>
      <div class="stat-line">Wins: <span id="b-wins"></span></div>
      <div class="stat-line">Losses: <span id="b-losses"></span></div>
      <div class="stat-line">Draws: <span id="b-draws"></span></div>
      <div class="stat-line-d">Win Rate: <span id="b-winrate"></span></div>
      <div class="stat-line-d">Avg Accuracy: <span id="b-acc"></span></div>
    </div>
  </div>
</body>
</html>
